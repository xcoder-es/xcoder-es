<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Carlos Pinto, CTO and AI platform architect. An animated diagram of the Nomos Neural Parliament: seven members vote on a proposal and the motion is enacted." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  :root {
    --fg: #1B2233;
    --muted: #5B6577;
    --rule: #C8CDD8;
    --seat: #B9C0CD;
    --brass: #8A6E12;
    --dissent: #8C2F39;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #E9E4DA;
      --muted: #8A94A6;
      --rule: #2E3646;
      --seat: #3D465A;
      --brass: #D8B44A;
      --dissent: #C2545F;
    }
  }

  .name {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 58px; font-weight: 600; letter-spacing: -0.5px; fill: var(--fg);
  }
  .role {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 21px; fill: var(--fg);
  }
  .sub {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; fill: var(--muted);
  }
  .label {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10.5px; fill: var(--muted);
  }
  .verdict {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px; fill: var(--brass); letter-spacing: 0.4px;
  }
  .rule { stroke: var(--rule); stroke-width: 1.5; }
  .arc { fill: none; stroke: var(--rule); stroke-width: 1; stroke-dasharray: 2 5; }
  .seat { fill: var(--seat); }
  .track { fill: var(--rule); opacity: .55; }
  .fill { fill: var(--brass); }
  .spk { fill: none; stroke: var(--fg); stroke-width: 1.6; }

  .anim { animation-duration: 10.0s; animation-iteration-count: infinite; animation-timing-function: linear; }
  .dot { animation-timing-function: cubic-bezier(.4,0,.2,1); }
  .bar { animation-name: tally; }
  .vd { animation-name: verdict; }
  .prop { animation-name: proposal; offset-path: path('M 760.0 215.0 L 760.0 118'); }
  .spkpulse { animation-name: speaker; }
  .v0 { animation-name: vote0; }
  .p0 { animation-name: pulse0; offset-path: path('M 658.6 187.8 L 760.0 215.0'); }
  .v1 { animation-name: vote1; }
  .p1 { animation-name: pulse1; offset-path: path('M 679.6 147.5 L 760.0 215.0'); }
  .v2 { animation-name: vote2; }
  .p2 { animation-name: pulse2; offset-path: path('M 715.6 119.8 L 760.0 215.0'); }
  .v3 { animation-name: vote3; }
  .p3 { animation-name: pulse3; offset-path: path('M 760.0 110.0 L 760.0 215.0'); }
  .v4 { animation-name: vote4; }
  .p4 { animation-name: pulse4; offset-path: path('M 804.4 119.8 L 760.0 215.0'); }
  .v5 { animation-name: vote5; }
  .p5 { animation-name: pulse5; offset-path: path('M 840.4 147.5 L 760.0 215.0'); }
  .v6 { animation-name: vote6; }
  .p6 { animation-name: pulse6; offset-path: path('M 861.4 187.8 L 760.0 215.0'); }

  @media (prefers-reduced-motion: reduce) {
    .anim { animation: none; }
    .dot, .prop { opacity: 0; }
    .bar { width: 180px; }
  }

@keyframes vote0 {
  0%, 12.0% { opacity: 0; }
  15.5%, 87.0% { opacity: 1; }
  95.0%, 100% { opacity: 0; }
}
@keyframes pulse0 {
  0%, 12.0% { offset-distance: 0%; opacity: 0; }
  12.3% { opacity: 1; }
  15.5% { offset-distance: 100%; opacity: 1; }
  16.7%, 100% { offset-distance: 100%; opacity: 0; }
}
@keyframes vote1 {
  0%, 16.5% { opacity: 0; }
  20.0%, 87.0% { opacity: 1; }
  95.0%, 100% { opacity: 0; }
}
@keyframes pulse1 {
  0%, 16.5% { offset-distance: 0%; opacity: 0; }
  16.8% { opacity: 1; }
  20.0% { offset-distance: 100%; opacity: 1; }
  21.2%, 100% { offset-distance: 100%; opacity: 0; }
}
@keyframes vote2 {
  0%, 21.0% { opacity: 0; }
  24.5%, 87.0% { opacity: 1; }
  95.0%, 100% { opacity: 0; }
}
@keyframes pulse2 {
  0%, 21.0% { offset-distance: 0%; opacity: 0; }
  21.3% { opacity: 1; }
  24.5% { offset-distance: 100%; opacity: 1; }
  25.7%, 100% { offset-distance: 100%; opacity: 0; }
}
@keyframes vote3 {
  0%, 25.5% { opacity: 0; }
  29.0%, 87.0% { opacity: 1; }
  95.0%, 100% { opacity: 0; }
}
@keyframes pulse3 {
  0%, 25.5% { offset-distance: 0%; opacity: 0; }
  25.8% { opacity: 1; }
  29.0% { offset-distance: 100%; opacity: 1; }
  30.2%, 100% { offset-distance: 100%; opacity: 0; }
}
@keyframes vote4 {
  0%, 30.0% { opacity: 0; }
  33.5%, 87.0% { opacity: 1; }
  95.0%, 100% { opacity: 0; }
}
@keyframes pulse4 {
  0%, 30.0% { offset-distance: 0%; opacity: 0; }
  30.3% { opacity: 1; }
  33.5% { offset-distance: 100%; opacity: 1; }
  34.7%, 100% { offset-distance: 100%; opacity: 0; }
}
@keyframes vote5 {
  0%, 34.5% { opacity: 0; }
  38.0%, 87.0% { opacity: 1; }
  95.0%, 100% { opacity: 0; }
}
@keyframes pulse5 {
  0%, 34.5% { offset-distance: 0%; opacity: 0; }
  34.8% { opacity: 1; }
  38.0% { offset-distance: 100%; opacity: 1; }
  39.2%, 100% { offset-distance: 100%; opacity: 0; }
}
@keyframes vote6 {
  0%, 39.0% { opacity: 0; }
  42.5%, 87.0% { opacity: 1; }
  95.0%, 100% { opacity: 0; }
}
@keyframes pulse6 {
  0%, 39.0% { offset-distance: 0%; opacity: 0; }
  39.3% { opacity: 1; }
  42.5% { offset-distance: 100%; opacity: 1; }
  43.7%, 100% { offset-distance: 100%; opacity: 0; }
}
@keyframes tally {
  0.0% { width: 0px; }
  12.0% { width: 0px; }
  15.5% { width: 30px; }
  24.5% { width: 60px; }
  29.0% { width: 90px; }
  33.5% { width: 120px; }
  38.0% { width: 150px; }
  42.5% { width: 180px; }
  87.0% { width: 180px; }
  95.0% { width: 0px; }
}
@keyframes verdict {
  0%, 46.0% { opacity: 0; }
  50.5%, 87.0% { opacity: 1; }
  95.0%, 100% { opacity: 0; }
}
@keyframes proposal {
  0%, 2.5% { offset-distance: 0%; opacity: 0; }
  4.0% { opacity: 1; }
  10.5% { offset-distance: 100%; opacity: 1; }
  12.5%, 100% { offset-distance: 100%; opacity: 0; }
}
@keyframes speaker {
  0%, 1.5% { opacity: .45; }
  4.0% { opacity: 1; }
  12.0%, 87.0% { opacity: .75; }
  95.0%, 100% { opacity: .45; }
}
</style>

  <!-- identity -->
  <text class="name" x="44" y="128">Carlos Pinto</text>
  <line class="rule" x1="46" y1="150" x2="330" y2="150"/>
  <text class="role" x="44" y="182">CTO and AI platform architect</text>
  <text class="sub" x="44" y="212">Author of Nomos, a formal framework for self-governing AI</text>
  <text class="sub" x="44" y="234">Below: seven members deliberate, weigh and enact a motion</text>

  <!-- chamber -->
  <path class="arc" d="M 655.0 215.0 A 105.0 105.0 0 0 1 865.0 215.0"/>
  <circle class="seat" cx="658.6" cy="187.8" r="7"/>
  <circle class="anim v0" cx="658.6" cy="187.8" r="7" fill="var(--brass)"/>
  <text class="label" x="634.4" y="184.4" text-anchor="end">Reward</text>
  <circle class="seat" cx="679.6" cy="147.5" r="7"/>
  <circle class="anim v1" cx="679.6" cy="147.5" r="7" fill="var(--dissent)"/>
  <text class="label" x="660.4" y="134.4" text-anchor="end">Safety</text>
  <circle class="seat" cx="715.6" cy="119.8" r="7"/>
  <circle class="anim v2" cx="715.6" cy="119.8" r="7" fill="var(--brass)"/>
  <text class="label" x="705.1" y="100.2" text-anchor="end">Curiosity</text>
  <circle class="seat" cx="760.0" cy="110.0" r="7"/>
  <circle class="anim v3" cx="760.0" cy="110.0" r="7" fill="var(--brass)"/>
  <text class="label" x="760.0" y="88.0" text-anchor="middle">Planning</text>
  <circle class="seat" cx="804.4" cy="119.8" r="7"/>
  <circle class="anim v4" cx="804.4" cy="119.8" r="7" fill="var(--brass)"/>
  <text class="label" x="814.9" y="100.2" text-anchor="start">Memory</text>
  <circle class="seat" cx="840.4" cy="147.5" r="7"/>
  <circle class="anim v5" cx="840.4" cy="147.5" r="7" fill="var(--brass)"/>
  <text class="label" x="859.6" y="134.4" text-anchor="start">Social</text>
  <circle class="seat" cx="861.4" cy="187.8" r="7"/>
  <circle class="anim v6" cx="861.4" cy="187.8" r="7" fill="var(--brass)"/>
  <text class="label" x="885.6" y="184.4" text-anchor="start">Integrity</text>

  <!-- speaker -->
  <g class="anim spkpulse">
    <rect class="spk" x="749.0" y="204.0" width="22" height="22" rx="3" transform="rotate(45 760.0 215.0)"/>
  </g>
  <circle class="anim prop" r="3.4" fill="var(--fg)"/>
  <circle class="anim p0 dot" r="2.6" fill="var(--brass)"/>
  <circle class="anim p1 dot" r="2.6" fill="var(--dissent)"/>
  <circle class="anim p2 dot" r="2.6" fill="var(--brass)"/>
  <circle class="anim p3 dot" r="2.6" fill="var(--brass)"/>
  <circle class="anim p4 dot" r="2.6" fill="var(--brass)"/>
  <circle class="anim p5 dot" r="2.6" fill="var(--brass)"/>
  <circle class="anim p6 dot" r="2.6" fill="var(--brass)"/>

  <!-- tally -->
  <rect class="track" x="655" y="252" width="210" height="5" rx="2.5"/>
  <rect class="fill anim bar" x="655" y="252" width="0" height="5" rx="2.5"/>
  <text class="verdict anim vd" x="655" y="278">6 of 7 in favour, 1 dissent, motion enacted</text>
</svg>
