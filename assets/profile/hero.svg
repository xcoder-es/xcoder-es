<title id="title">Carlos Pinto. CTO by role. Builder by default.</title>
<desc id="desc">Carlos Pinto, xcoder-es, based in Madrid. AI platforms, SaaS products and the engineering in between. Building FirstLook, shaping Apivo, exploring Nomos. Open to business, collaborations and good conversations.</desc>
