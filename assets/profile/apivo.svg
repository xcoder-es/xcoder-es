<text x="28" y="40" font-size="13" class="mono peach" letter-spacing=".8">03 / FRACTIONAL CTO</text><text x="28" y="104" font-size="48" class="serif" letter-spacing="-1">Apivo</text><text x="28" y="149" font-size="20" class="" >Small services. Bigger picture.</text><text x="28" y="184" font-size="16" class="muted" >Technical direction and delivery.</text><text x="28" y="209" font-size="16" class="muted" >Independent launches. Connected thinking.</text><path d="M28 239H532" stroke="var(--line)"/><text x="28" y="268" font-size="12" class="mono muted" >2026–PRESENT</text><text x="530" y="268" font-size="12" class="mono peach" text-anchor="end">LET’S TALK ↗</text>
