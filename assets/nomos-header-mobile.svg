<svg xmlns="http://www.w3.org/2000/svg" width="640" height="604"
  viewBox="0 0 640 604" role="img" aria-labelledby="header-title header-description">
<title id="header-title">Carlos Pinto — CTO at Voomverse, S.L. and Fractional CTO at Apivo, both 2026–present. CTO and AI platform architect.</title>
<desc id="header-description">Both current appointments remain visible throughout this animated career overview: CTO at Voomverse, S.L., building FirstLook, and Fractional CTO at Apivo, each 2026–present. They are concurrent, not successive. 2010–2012: Amazon, Principal SDE → Senior SDM. 2012–2013: Google, SWE III · Google Cloud Platform. 2013: NASA, Database Engineer · contract. 2013–2014: Google, Senior Staff SWE · ML &amp; RecSys. 2014–2016: Google Research, Senior Staff SWE · Responsible AI. 2017–2019: Hitachi Vantara, Senior Lead · Service Engineering. 2019–2021: Neurona Technologies, Founding CTO · acquired. 2022–2023: Datacom, Senior Solutions Architect. 2023–2026: Datacom / Datapay, Senior AI Architect · AI strategy. Based in Madrid. Open to business, collaborations and interesting conversations, not seeking a new role. Milestones are not drawn to a proportional time scale. The README contains the complete static career table. Motion follows the viewer&#x27;s reduced-motion preference.</desc>
<!--
  Corrected career header, 14 October 2026.
  Career facts supplied by Carlos Pinto; current appointments explicitly corrected by him.
  The overview groups employers; the animated captions retain every distinct past role.
  No scripts, external assets, embedded fonts, tracking or private repository data.
  Current appointments stay visible throughout; reduced motion shows the current caption.
  Edit the text elements directly to maintain this header.
-->
<style>
:root {
  color-scheme: light dark;
  --fg: #1B2233; --muted: #5B6577; --rule: #D5D6D8;
  --surface: #F6F4F0; --dim: #B9C0CD;
  --gold: #A16207; --signal: #C2410C;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fg: #E9E4DA; --muted: #A4ADBC; --rule: #303848;
    --surface: #151C28; --dim: #536075;
    --gold: #DDC078; --signal: #F3A36A;
  }
}
text {
  fill: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
.name {
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  font-size: 68px; font-weight: 500; letter-spacing: -1.7px;
}
.subtitle { font-size: 22px; }
.mono, .eyebrow, .date, .caption, .chapter-meta {
  font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace;
}
.eyebrow { font-size: 11px; letter-spacing: 1.5px; fill: var(--muted); }
.caption { font-size: 11px; letter-spacing: 1.8px; fill: var(--muted); }
.invitation { font-size: 17px; }
.aside { font-size: 14px; fill: var(--muted); }
.card { fill: var(--surface); stroke: var(--rule); stroke-width: 1; }
.card-active { fill: none; stroke: var(--gold); stroke-width: 1; opacity: 0; }
.appointment { font-size: 14px; font-weight: 600; letter-spacing: 1.4px; fill: var(--gold); }
.employer { font-size: 28px; font-weight: 600; letter-spacing: -.4px; }
.date { font-size: 11px; fill: var(--muted); }
.focus { font-size: 16px; fill: var(--muted); }
.rule { stroke: var(--rule); stroke-width: 1; fill: none; }
.rail { stroke: var(--rule); stroke-width: 1.5; fill: none; }
.rail-node { fill: var(--dim); }
.rail-name { font-size: 14px; font-weight: 600; }
.rail-date { font-size: 11px; fill: var(--muted); }
.rail-name.current { fill: var(--gold); }
.chapter-meta { font-size: 11px; letter-spacing: .8px; fill: var(--gold); }
.chapter-title { font-size: 20px; }
.chapter-current-title { font-size: 18px; }
.chapter-index { font-size: 12px; fill: var(--muted); }
.sparkle { stroke: var(--gold); fill: none; stroke-width: 1.5; stroke-linecap: round; }
.sparkle-inner { transform-box: fill-box; transform-origin: center; animation: twinkle 6s ease-in-out infinite; }
@keyframes twinkle { 0%,75%,100% {opacity:.6;transform:rotate(0deg) scale(1)} 88% {opacity:1;transform:rotate(90deg) scale(1.1)} }
.chapter { opacity: 0; }
.chapter-current { opacity: 1; }
.cycle { animation-duration: 34s; animation-timing-function: linear; animation-iteration-count: infinite; }
.lit-node { fill: var(--signal); opacity: 0; }
.halo { fill: none; stroke: var(--gold); stroke-width: 1.5; opacity: 0; }
.now-node { fill: var(--gold); }
.pulse { fill: none; stroke: var(--gold); stroke-width: 1; opacity: .35; animation: breathe 3.4s ease-in-out infinite; }
@keyframes breathe { 0%,100% {r:8;opacity:.16} 50% {r:12;opacity:.5} }
.beam { fill: var(--gold); opacity: .75; }
.beam-halo { fill: var(--gold); opacity: .12; }

