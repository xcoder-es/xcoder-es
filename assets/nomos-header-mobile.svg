@keyframes journey{0.00000%{transform:translate(90px,344px);}7.29412%{transform:translate(90px,344px);}7.94118%{transform:translate(254px,344px);}15.23529%{transform:translate(254px,344px);}15.88235%{transform:translate(418px,344px);}23.17647%{transform:translate(418px,344px);}23.82353%{transform:translate(254px,344px);}31.11765%{transform:translate(254px,344px);}31.76471%{transform:translate(254px,344px);}39.05882%{transform:translate(254px,344px);}39.70588%{transform:translate(582px,344px);}47.00000%{transform:translate(582px,344px);}47.64706%{transform:translate(746px,344px);}54.94118%{transform:translate(746px,344px);}55.58824%{transform:translate(910px,344px);}62.88235%{transform:translate(910px,344px);}63.52941%{transform:translate(910px,344px);}70.82353%{transform:translate(910px,344px);}71.47059%{transform:translate(1100px,344px);}99.35294%{transform:translate(1100px,344px);}100%{transform:translate(90px,344px);}}
.journey{animation-name:journey;}
.name { font-size: 54px; letter-spacing: -1.2px; }
.subtitle { font-size: 20px; }
.eyebrow { font-size: 12px; }
.appointment { font-size: 14px; }
.employer { font-size: 29px; }
.date { font-size: 13px; }
.focus { font-size: 16px; }
.chapter-meta { font-size: 12px; }
.chapter-title { font-size: 20px; }
.chapter-current-title { font-size: 17px; }
.caption { font-size: 12px; }
.invitation { font-size: 17px; }
.mobile-dot { fill: var(--dim); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
  .chapter { opacity: 0 !important; }
  .chapter-current { opacity: 1 !important; }
  .moving, .lit-node, .halo, .pulse { display: none; }
  .card-active { opacity: .5; }
  .sparkle-inner { opacity: .75; }
}
